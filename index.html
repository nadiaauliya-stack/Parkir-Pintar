<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Parking Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --asphalt: #23272B; --asphalt-2: #2E3338; --paint: #ECEBE4; --ink: #F3F2EC;
    --muted: #A0A8AF; --free: #34B877; --taken: #EA5A5F; --caution: #F5C518;
    --sign-free: #0F4030; --sign-full: #4E1A1D; --sign-idle: #2F3A44;
    --car: #8FA6BD; --gate-open: #34B877; --gate-closed: #EA5A5F;
    --font-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--asphalt); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; min-height: 100vh; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 20px 48px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.1; }
  h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 0 0 14px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1.5px solid var(--muted); border-radius: 999px; font-size: 15px; font-weight: 500; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .pill[data-state="live"] { border-color: var(--free); } .pill[data-state="live"] .dot { background: var(--free); }
  .pill[data-state="warn"] { border-color: var(--caution); } .pill[data-state="warn"] .dot { background: var(--caution); }
  .pill[data-state="off"] { border-color: var(--taken); } .pill[data-state="off"] .dot { background: var(--taken); }

  .sign { display: flex; align-items: center; gap: 22px; padding: 20px 24px; background: var(--sign-idle); border: 4px solid var(--paint); border-radius: 14px; margin-bottom: 32px; transition: background-color .4s ease; }
  .sign[data-mode="free"] { background: var(--sign-free); }
  .sign[data-mode="full"] { background: var(--sign-full); }
  .count { font-family: var(--font-display); font-weight: 700; font-size: 96px; line-height: .9; min-width: 1.1ch; text-align: center; }
  .sign-text { display: flex; flex-direction: column; gap: 2px; }
  .sign-main { font-family: var(--font-display); font-weight: 600; font-size: 28px; }
  .sign-sub { color: #CFD6DB; font-size: 16px; }

  .gates { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
  .gate-card { background: var(--asphalt-2); border-radius: 14px; padding: 20px; text-align: center; }
  .gate-icon { width: 100%; height: 100px; display: flex; align-items: center; justify-content: center; }
  .barrier { width: 130px; height: 10px; background: var(--gate-closed); border-radius: 5px; transform-origin: left center; transition: transform .6s ease, background-color .4s ease; }
  .gate-card[data-open="true"] .barrier { background: var(--gate-open); transform: rotate(-55deg); }
  .gate-name { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin-top: 6px; }
  .gate-status { margin-top: 4px; color: var(--muted); font-weight: 500; }
  .gate-card[data-open="true"] .gate-status { color: var(--free); }

  .lot { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .floor { position: relative; overflow: hidden; aspect-ratio: 3 / 4; background: var(--asphalt-2); border: 7px solid var(--paint); border-bottom: 0; border-radius: 3px 3px 0 0; }
  .bay-letter { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 84px; color: var(--paint); opacity: .28; user-select: none; }
  .car { position: absolute; left: 50%; bottom: 8%; width: 62%; transform: translate(-50%, 130%); transition: transform .8s cubic-bezier(.22,.8,.3,1); }
  .bay[data-state="taken"] .car { transform: translate(-50%, 0); }
  .car svg { display: block; width: 100%; height: auto; }
  .bay-info { padding-top: 10px; text-align: center; }
  .bay h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; }
  .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; font-weight: 500; justify-content: center; }
  .status .dot { width: 12px; height: 12px; }
  .bay[data-state="free"] .status .dot { background: var(--free); }
  .bay[data-state="taken"] .status .dot { background: var(--taken); }

  .meta { margin: 26px 0 0; color: var(--muted); font-size: 15px; }
  .notice { margin-top: 20px; padding: 12px 14px; border-left: 5px solid var(--caution); background: var(--asphalt-2); font-size: 15px; }
  .notice code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }

  @media (max-width: 420px) { .count { font-size: 76px; } .lot, .gates { gap: 14px; } .bay-letter { font-size: 68px; } }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Smart Parking</h1>
    <div class="pill" id="pill" data-state="idle" role="status">
      <span class="dot"></span><span id="pillText">Menyambung…</span>
    </div>
  </header>

  <section class="sign" id="sign" data-mode="idle" aria-live="polite">
    <div class="count" id="count">–</div>
    <div class="sign-text">
      <span class="sign-main" id="signMain">Memuat data</span>
      <span class="sign-sub" id="signSub">Menunggu data dari ESP32</span>
    </div>
  </section>

  <h2>Gate</h2>
  <section class="gates" id="gates">
    <div class="gate-card" id="gate-gateIn" data-open="false">
      <div class="gate-icon"><div class="barrier"></div></div>
      <div class="gate-name">Gate IN</div>
      <div class="gate-status" data-text>Tertutup</div>
    </div>
    <div class="gate-card" id="gate-gateOut" data-open="false">
      <div class="gate-icon"><div class="barrier"></div></div>
      <div class="gate-name">Gate OUT</div>
      <div class="gate-status" data-text>Tertutup</div>
    </div>
  </section>

  <h2>Slot parkir</h2>
  <section class="lot" id="lot" aria-label="Status slot parkir"></section>

  <p class="meta" id="meta"></p>

  <div id="demo" hidden>
    <div class="notice">
      Mode demo: halaman belum terhubung ke Firebase. Buka <code>index.html</code>, cari
      <code>FIREBASE_URL</code>, lalu isi dengan URL database kamu (harus sama dengan yang ada di kode ESP32).
    </div>
  </div>
</main>

<script>
/* ============ KONFIGURASI ============
   Samakan dengan FIREBASE_URL di kode ESP32 (tanpa "/" di akhir). */
const FIREBASE_URL = "https://parkir-pintar-8b8ed-default-rtdb.asia-southeast1.firebasedatabase.app/";

// ESP32 mengirim ulang data tiap 30 detik. Lewat batas ini dianggap tidak merespons.
const ESP_TIMEOUT_MS = 75000;

const SLOTS = [ { key: "slotA", label: "A" }, { key: "slotB", label: "B" } ];
const GATES = [ { key: "gateIn", label: "Gate IN" }, { key: "gateOut", label: "Gate OUT" } ];

const CAR_SVG = `
<svg viewBox="0 0 100 180" aria-hidden="true">
  <rect x="-4" y="26" width="12" height="30" rx="4" fill="#111"/>
  <rect x="92" y="26" width="12" height="30" rx="4" fill="#111"/>
  <rect x="-4" y="122" width="12" height="30" rx="4" fill="#111"/>
  <rect x="92" y="122" width="12" height="30" rx="4" fill="#111"/>
  <rect x="4" y="4" width="92" height="172" rx="26" fill="var(--car)"/>
  <rect x="16" y="44" width="68" height="34" rx="9" fill="#1B2A38"/>
  <rect x="16" y="112" width="68" height="26" rx="8" fill="#1B2A38"/>
  <rect x="20" y="80" width="60" height="30" rx="6" fill="#7A92AA"/>
</svg>`;

const lot = document.getElementById("lot");
lot.innerHTML = SLOTS.map(s => `
  <article class="bay" id="bay-${s.key}" data-state="unknown">
    <div class="floor">
      <div class="bay-letter">${s.label}</div>
      <div class="car">${CAR_SVG}</div>
    </div>
    <div class="bay-info">
      <h3>Slot ${s.label}</h3>
      <div class="status"><span class="dot"></span><span class="status-text">Belum ada data</span></div>
    </div>
  </article>`).join("");

let tree = null;
let dbOk = false;
let lastKey = null;
let lastChangeAt = null;
let demoMode = FIREBASE_URL.includes("NAMA-PROJECT");

function occupiedOf(slotKey) {
  const v = tree && tree[slotKey] && tree[slotKey].occupied;
  return typeof v === "boolean" ? v : null;
}
function gateStatusOf(gateKey) {
  const v = tree && tree[gateKey] && tree[gateKey].status;
  return typeof v === "string" ? v : null;
}
function espAlive() {
  return lastChangeAt !== null && (Date.now() - lastChangeAt) < ESP_TIMEOUT_MS;
}
function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 5) return "baru saja";
  if (s < 60) return s + " detik lalu";
  const m = Math.floor(s / 60);
  if (m < 60) return m + " menit lalu";
  return Math.floor(m / 60) + " jam lalu";
}

function render() {
  const states = SLOTS.map(s => occupiedOf(s.key));
  const known = states.every(v => v !== null);
  const freeCount = states.filter(v => v === false).length;
  const stale = !demoMode && dbOk && !espAlive();

  SLOTS.forEach((s, i) => {
    const el = document.getElementById("bay-" + s.key);
    const v = states[i];
    el.dataset.state = v === null ? "unknown" : v ? "taken" : "free";
    el.querySelector(".status-text").textContent = v === null ? "Belum ada data" : v ? "Terisi" : "Kosong";
  });
  lot.style.opacity = stale ? .55 : 1;

  GATES.forEach(g => {
    const el = document.getElementById("gate-" + g.key);
    const status = gateStatusOf(g.key);
    const open = status === "terbuka";
    el.dataset.open = open ? "true" : "false";
    el.querySelector("[data-text]").textContent = status === null ? "Belum ada data" : open ? "Terbuka" : "Tertutup";
  });
  document.getElementById("gates").style.opacity = stale ? .55 : 1;

  const sign = document.getElementById("sign");
  const count = document.getElementById("count");
  const main = document.getElementById("signMain");
  const sub = document.getElementById("signSub");

  if (!known) {
    sign.dataset.mode = "idle"; count.textContent = "–";
    main.textContent = "Memuat data"; sub.textContent = "Menunggu data dari ESP32";
  } else if (freeCount === 0) {
    sign.dataset.mode = "full"; count.textContent = "0";
    main.textContent = "Parkir penuh"; sub.textContent = "Semua " + SLOTS.length + " slot sedang terisi";
  } else {
    sign.dataset.mode = "free"; count.textContent = String(freeCount);
    main.textContent = "Tempat kosong"; sub.textContent = "dari " + SLOTS.length + " slot parkir";
  }

  const pill = document.getElementById("pill");
  const pillText = document.getElementById("pillText");
  if (demoMode) { pill.dataset.state = "warn"; pillText.textContent = "Mode demo"; }
  else if (!dbOk) { pill.dataset.state = tree ? "off" : "idle"; pillText.textContent = tree ? "Database terputus" : "Menyambung…"; }
  else if (stale) { pill.dataset.state = "warn"; pillText.textContent = "ESP32 tidak merespons"; }
  else { pill.dataset.state = "live"; pillText.textContent = "Data langsung"; }

  const meta = document.getElementById("meta");
  meta.textContent = lastChangeAt === null ? "" :
    (stale ? "Data terakhir dari ESP32 diterima " : "Diperbarui ") + ago(Date.now() - lastChangeAt);
}

function setPath(root, path, value) {
  const parts = path.split("/").filter(Boolean);
  if (parts.length === 0) return value;
  root = (root && typeof root === "object") ? root : {};
  let node = root;
  for (let i = 0; i < parts.length - 1; i++) {
    if (!node[parts[i]] || typeof node[parts[i]] !== "object") node[parts[i]] = {};
    node = node[parts[i]];
  }
  const last = parts[parts.length - 1];
  if (value === null) delete node[last]; else node[last] = value;
  return root;
}

function ingest() {
  const parts = [];
  SLOTS.forEach(s => { const v = tree && tree[s.key]; parts.push(v ? v.updated + "|" + v.occupied : ""); });
  GATES.forEach(g => { const v = tree && tree[g.key]; parts.push(v ? v.updated + "|" + v.status : ""); });
  const key = parts.join("~");
  if (key !== lastKey) { lastKey = key; lastChangeAt = Date.now(); }
  render();
}

function connect() {
  const es = new EventSource(FIREBASE_URL + "/parking.json");
  es.onopen = () => { dbOk = true; render(); };
  es.onerror = () => { dbOk = false; render(); };

  es.addEventListener("put", e => {
    const msg = JSON.parse(e.data);
    tree = setPath(tree, msg.path, msg.data);
    dbOk = true; ingest();
  });
  es.addEventListener("patch", e => {
    const msg = JSON.parse(e.data);
    Object.keys(msg.data || {}).forEach(k => { tree = setPath(tree, msg.path + "/" + k, msg.data[k]); });
    dbOk = true; ingest();
  });
  es.addEventListener("auth_revoked", () => { dbOk = false; render(); });
}

function startDemo() {
  document.getElementById("demo").hidden = false;
  tree = {
    gateIn:  { status: "tertutup", updated: 1 },
    gateOut: { status: "tertutup", updated: 1 },
    slotA:   { occupied: true,  updated: 1 },
    slotB:   { occupied: false, updated: 1 }
  };
  dbOk = true; ingest();
}

if (demoMode) startDemo(); else connect();
setInterval(render, 1000);
render();
</script>
</body>
</html>
